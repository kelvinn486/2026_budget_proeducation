<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 포항혁신지구 예산 관리</title>
<link rel="stylesheet" href="../assets/budget.css?v=2">
</head>
<body>
<div class="loading-overlay" id="loading">⟳ 서버와 동기화 중...</div>

<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <div class="page-title">2026년 포항혁신지구 지원사업 예산 관리</div>
      <div class="page-subtitle">
        <span class="author-badge">작성자: <strong id="author-display">—</strong>
          <button class="link-btn" onclick="changeAuthor()">변경</button>
        </span>
        <span class="sync-info">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-text">—</span>
        </span>
      </div>
    </div>
    <div class="header-right">
      <button class="hdr-btn primary" onclick="fetchData()">🔄 새로고침</button>
      <button class="hdr-btn" onclick="window.print()">🖨 인쇄</button>
      <button class="hdr-btn" onclick="exportBackup()">💾 백업</button>
    </div>
  </div>

  <div class="summary-grid" id="summary">
    <div class="metric"><div class="metric-label">총 예산</div><div class="metric-value">—</div></div>
    <div class="metric"><div class="metric-label">집행액</div><div class="metric-value">—</div></div>
    <div class="metric"><div class="metric-label">잔액</div><div class="metric-value">—</div></div>
  </div>

  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
    <span>그룹별 예산 현황 (단위: 원)</span>
    <span class="section-hint">⋮⋮ 을 잡고 끌어 순서를 바꾸면 모든 부서원 화면에 반영됩니다 (같은 그룹 안에서만)</span>
  </div>

  <div id="groups-container">
    <div class="tbl-wrap"><div class="initial-loader">
      <div class="spinner"></div>
      <div>서버에서 예산 데이터를 불러오는 중...</div>
    </div></div>
  </div>

  <div class="page-footer">
    <span>공용 백엔드: Google Sheets · 모든 변경은 즉시 전부서원에게 반영됩니다</span>
    <a class="link-btn" href="../">전문교육부 예산 관리로 이동 →</a>
  </div>
</div>

<script src="../assets/budget-common.js?v=2"></script>
<script>
/* ============== 이 화면의 설정 ============== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx4_EY-ErQtDK2U7ibZ7ufgrQJZ72gnD2tflnYP7RgedTEM4ov4eUPvTzCHYtWQ8xBQRA/exec';
const PROGRAM_NAME = '포항혁신지구 지원사업';
const BACKUP_PREFIX = '포항혁신지구';
const USE_GROUPS = true;
const DESC_PLACEHOLDER = '예: 3회 전공 방과후';

/* ============== 그룹별 항목 목록 ============== */
function renderBody(){
  const box = document.getElementById('groups-container');
  if (!items.length) {
    box.innerHTML = `<div class="tbl-wrap"><div class="empty-note" style="padding:30px">예산 항목이 없습니다. Google 시트의 items 탭을 확인하세요.</div></div>`;
    return;
  }
  box.innerHTML = groups.map(g => {
    const list = groupItems(g.id);
    if (!list.length) return '';
    const b = groupBudget(g.id), u = groupUsed(g.id), rem = b - u;
    const gp = pct(u, b), gcls = sc(u, b);
    return `<section class="group-section">
      <div class="group-header">
        <div class="group-title-row">
          <div class="group-name">${esc(g.name)}</div>
          <div class="group-pct">집행률 ${gp}%</div>
        </div>
        <div class="group-stats">
          <div class="group-stat"><span class="lbl">예산</span><span class="val">${fmt(b)}</span></div>
          <div class="group-stat"><span class="lbl">집행</span><span class="val">${fmt(u)}</span></div>
          <div class="group-stat"><span class="lbl">잔액</span><span class="val ${gcls}">${fmt(rem)}</span></div>
        </div>
        <div class="group-bar"><div class="group-bar-fill ${gcls}" style="width:${Math.min(gp,100)}%"></div></div>
      </div>
      <div class="tbl-wrap group-tbl">
        <div class="tbl-head">
          <div class="row-grid">
            <div class="th"></div><div class="th">항목</div>
            <div class="th r">예산</div><div class="th r">집행</div><div class="th r">잔액</div>
            <div class="th c">집행 현황</div><div class="th"></div>
          </div>
        </div>
        <div>${list.map((it, idx) => renderItemCard(it, idx, g.id)).join('')}</div>
      </div>
    </section>`;
  }).join('');
}

startApp();
</script>
</body>
</html>
