<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 전문교육부 예산 관리 (공용)</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;

  --color-background-primary: #ffffff;
  --color-background-secondary: #f5f4ef;
  --color-background-tertiary: #faf9f5;
  --color-background-info: #E6F1FB;
  --color-background-success: #E1F5EE;
  --color-background-danger: #FCEBEB;

  --color-text-primary: #2C2C2A;
  --color-text-secondary: #5F5E5A;
  --color-text-tertiary: #888780;
  --color-text-info: #0C447C;
  --color-text-success: #0F6E56;
  --color-text-danger: #A32D2D;

  --color-border-tertiary: rgba(0,0,0,0.1);
  --color-border-secondary: rgba(0,0,0,0.2);
  --color-border-info: #85B7EB;
  --color-border-success: #9FE1CB;
  --color-border-danger: #F09595;

  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-background-primary: #1e1e1c;
    --color-background-secondary: #2a2a28;
    --color-background-tertiary: #161614;
    --color-background-info: #0C447C;
    --color-background-success: #085041;
    --color-background-danger: #501313;

    --color-text-primary: #f0efe9;
    --color-text-secondary: #b4b2a9;
    --color-text-tertiary: #888780;
    --color-text-info: #B5D4F4;
    --color-text-success: #9FE1CB;
    --color-text-danger: #F09595;

    --color-border-tertiary: rgba(255,255,255,0.12);
    --color-border-secondary: rgba(255,255,255,0.22);
  }
  body { background: #161614; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; }
body {
  font-family: var(--font-sans);
  font-size: 15px;
  color: var(--color-text-primary);
  background: var(--color-background-tertiary);
  padding: 24px 16px 48px;
}

.page-container { max-width: 920px; margin: 0 auto; }

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  gap: 12px;
}
.header-left { flex: 1; min-width: 0; }
.page-title { font-size: 22px; font-weight: 500; }
.page-subtitle {
  font-size: 12px;
  color: var(--color-text-tertiary);
  margin-top: 4px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.sync-info { display: inline-flex; align-items: center; gap: 4px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-success); }
.sync-dot.loading { background: #BA7517; animation: pulse 1s infinite; }
.sync-dot.error { background: var(--color-text-danger); }
@keyframes pulse { 50% { opacity: 0.3; } }

.author-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--color-background-secondary);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
}
.link-btn {
  background: none; border: none; font-family: inherit;
  color: var(--color-text-info); cursor: pointer; font-size: 11px;
  padding: 0; text-decoration: underline;
}

.header-right { display: flex; gap: 6px; flex-wrap: wrap; }
.hdr-btn {
  font-size: 12px; padding: 6px 12px;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.hdr-btn:hover { background: var(--color-background-secondary); }
.hdr-btn.primary {
  color: var(--color-text-info);
  border-color: var(--color-border-info);
}
.hdr-btn.primary:hover { background: var(--color-background-info); }

.summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1.5rem; }
.metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 14px 16px; }
.metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
.metric-value { font-size: 17px; font-weight: 500; }
.metric-value.success { color: var(--color-text-success); }
.metric-value.danger  { color: var(--color-text-danger); }

.section-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
.tbl-wrap { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; background: var(--color-background-primary); }

.row-grid { display: grid; grid-template-columns: 20px 1fr 135px 125px 125px 140px 18px; align-items: center; }
.tbl-head { background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
.tbl-head .row-grid { padding: 9px 14px; }
.th { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); padding: 0 4px; }
.th.r { text-align: right; }
.th.c { text-align: center; }

.item-card { border-bottom: 0.5px solid var(--color-border-tertiary); }
.item-card:last-child { border-bottom: none; }
.item-row { padding: 10px 14px; cursor: pointer; user-select: none; }
.item-row:hover { background: var(--color-background-secondary); }
.item-card.dragging { opacity: 0.35; }
.item-card.drag-over > .item-row { box-shadow: inset 0 3px 0 var(--color-border-info); background: var(--color-background-info); }
.item-drag-handle { cursor: grab; color: var(--color-text-tertiary); text-align: center; font-size: 14px; user-select: none; line-height: 1; }
.item-drag-handle:active { cursor: grabbing; }
.item-drag-handle:hover { color: var(--color-text-primary); }
.section-hint { font-size: 11px; color: var(--color-text-tertiary); font-weight: 400; }

.cell { padding: 0 4px; font-size: 12px; }
.cell.r { text-align: right; }
.cell.name { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell.ok   { color: var(--color-text-success); font-weight: 500; }
.cell.warn { color: #BA7517; font-weight: 500; }
.cell.over { color: var(--color-text-danger); font-weight: 500; }

.bar-cell { padding: 0 4px; }
.bar-stack { height: 11px; border-radius: 5px; overflow: hidden; background: var(--color-background-secondary); }
.bar-fill { height: 100%; transition: width 0.3s; }
.bar-fill.ok   { background: #1D9E75; }
.bar-fill.warn { background: #BA7517; }
.bar-fill.over { background: #E24B4A; }
.bar-pct { font-size: 11px; color: var(--color-text-tertiary); text-align: center; margin-top: 2px; }

.arrow { font-size: 12px; color: var(--color-text-tertiary); text-align: center; transition: transform 0.2s; }
.arrow.open { transform: rotate(180deg); }

.item-body { border-top: 0.5px solid var(--color-border-tertiary); padding: 12px 14px; cursor: default; background: var(--color-background-tertiary); }

.exec-list-header, .exec-row {
  display: grid;
  grid-template-columns: 100px 1fr 130px 90px 110px;
  gap: 8px;
  align-items: center;
  padding: 8px 8px;
}
.exec-list-header { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); padding: 6px 8px; }
.exec-list-header .r { text-align: right; }
.exec-list-header .c { text-align: center; }

.exec-row { font-size: 13px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); border-radius: var(--border-radius-md); margin-top: 4px; }
.exec-date { color: var(--color-text-secondary); }
.exec-amt { text-align: right; font-weight: 500; }
.exec-author { font-size: 11px; color: var(--color-text-tertiary); text-align: center; }
.exec-actions { text-align: right; }

.btn-act { font-size: 12px; padding: 3px 8px; border-radius: var(--border-radius-md); background: none; cursor: pointer; white-space: nowrap; font-family: inherit; }
.btn-edit   { color: var(--color-text-info);     border: 0.5px solid var(--color-border-info); }
.btn-edit:hover   { background: var(--color-background-info); }
.btn-del    { color: var(--color-text-danger);   border: 0.5px solid var(--color-border-danger); margin-left: 4px; }
.btn-del:hover    { background: var(--color-background-danger); }
.btn-save   { color: var(--color-text-success);  border: 0.5px solid var(--color-border-success); }
.btn-save:hover   { background: var(--color-background-success); }
.btn-cancel { color: var(--color-text-secondary); border: 0.5px solid var(--color-border-secondary); margin-left: 4px; }
.btn-cancel:hover { background: var(--color-background-secondary); }

.edit-full-row { grid-column: 1 / -1; display: grid; grid-template-columns: 100px 1fr 130px 90px 110px; gap: 8px; align-items: center; padding: 8px 8px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); border-radius: var(--border-radius-md); margin-top: 4px; }
.edit-full-row input { font-size: 13px; padding: 5px 7px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); width: 100%; font-family: inherit; }
.edit-full-row .ph { font-size: 11px; color: var(--color-text-tertiary); text-align: center; }

.add-form-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 14px 16px; margin-top: 14px; }
.add-form-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 10px; }
.add-form-grid { display: grid; grid-template-columns: 150px 1fr 150px; gap: 12px; }
.field-group { display: flex; flex-direction: column; }
.field-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 5px; }
.field-group input { font-size: 14px; padding: 8px 10px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); width: 100%; font-family: inherit; }
.add-form-btn-row { display: flex; justify-content: flex-end; margin-top: 12px; }
.add-btn { font-size: 13px; padding: 8px 20px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; font-weight: 500; font-family: inherit; }
.add-btn:hover { background: var(--color-background-info); border-color: var(--color-border-info); color: var(--color-text-info); }

.empty-note { font-size: 13px; color: var(--color-text-tertiary); padding: 8px 4px; text-align: center; }

.page-footer { margin-top: 2rem; padding-top: 1rem; border-top: 0.5px solid var(--color-border-tertiary); font-size: 11px; color: var(--color-text-tertiary); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* 로딩 오버레이 */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0;
  background: var(--color-text-info); color: white;
  text-align: center; padding: 6px; font-size: 12px;
  z-index: 1000; display: none;
}
.loading-overlay.show { display: block; }

/* 초기 로딩 화면 */
.initial-loader {
  text-align: center; padding: 60px 20px;
  color: var(--color-text-secondary);
}
.initial-loader .spinner {
  display: inline-block; width: 32px; height: 32px;
  border: 3px solid var(--color-background-secondary);
  border-top-color: var(--color-text-info);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 인쇄 */
@media print {
  @page { size: A4 portrait; margin: 8mm 8mm; }
  body { background: white !important; padding: 0 !important; font-size: 9pt; }
  .loading-overlay, .header-right, .page-footer, .item-body, .add-form-card, .arrow, .item-drag-handle, .section-hint { display: none !important; }
  .page-header { margin-bottom: 6pt; padding-bottom: 4pt; }
  .page-title { font-size: 13pt; }
  .page-subtitle { font-size: 8pt; }
  .summary-grid { gap: 5pt; margin-bottom: 8pt; }
  .metric { padding: 5pt 7pt; background: #f2f1ec !important; border: 0.5pt solid #ccc; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .metric-label { font-size: 7.5pt; }
  .metric-value { font-size: 10.5pt; }
  .tbl-wrap { border: 0.5pt solid #999 !important; }
  .row-grid { grid-template-columns: minmax(0, 1fr) 78pt 72pt 72pt 92pt !important; }
  .tbl-head .row-grid { padding: 4pt 6pt; background: #f2f1ec !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tbl-head .row-grid > .th:first-child,
  .tbl-head .row-grid > .th:last-child { display: none !important; }
  .th { font-size: 7.5pt !important; }
  .item-row { padding: 3.5pt 6pt !important; cursor: default; }
  .cell { font-size: 8.5pt !important; min-width: 0; }
  .cell.name { font-size: 8.5pt !important; }
  .bar-stack { height: 5pt !important; background: #e4e2dd !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar-fill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar-fill.ok { background: #1D9E75 !important; }
  .bar-fill.warn { background: #BA7517 !important; }
  .bar-fill.over { background: #E24B4A !important; }
  .bar-pct { font-size: 6.5pt !important; }
}
</style>
</head>
<body>
<div class="loading-overlay" id="loading">⟳ 서버와 동기화 중...</div>

<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <div class="page-title">2026년 전문교육부 예산 관리</div>
      <div class="page-subtitle">
        <span class="author-badge">작성자: <strong id="author-display">—</strong>
          <button class="link-btn" onclick="changeAuthor()">변경</button>
        </span>
        <span class="sync-info">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-text">—</span>
        </span>
      </div>
    </div>
    <div class="header-right">
      <button class="hdr-btn primary" onclick="fetchData()">🔄 새로고침</button>
      <button class="hdr-btn" onclick="window.print()">🖨 인쇄</button>
      <button class="hdr-btn" onclick="exportBackup()">💾 백업</button>
    </div>
  </div>

  <div class="summary-grid" id="summary">
    <div class="metric"><div class="metric-label">총 예산</div><div class="metric-value">—</div></div>
    <div class="metric"><div class="metric-label">집행액</div><div class="metric-value">—</div></div>
    <div class="metric"><div class="metric-label">잔액</div><div class="metric-value">—</div></div>
  </div>

  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
    <span>예산 항목별 현황 (단위: 원)</span>
    <span class="section-hint">⋮⋮ 을 잡고 끌어 순서를 바꾸면 모든 부서원 화면에 반영됩니다</span>
  </div>
  <div class="tbl-wrap">
    <div class="tbl-head">
      <div class="row-grid">
        <div class="th"></div>
        <div class="th">항목</div>
        <div class="th r">예산</div>
        <div class="th r">집행</div>
        <div class="th r">잔액</div>
        <div class="th c">집행 현황</div>
        <div class="th"></div>
      </div>
    </div>
    <div id="items-list">
      <div class="initial-loader">
        <div class="spinner"></div>
        <div>서버에서 예산 데이터를 불러오는 중...</div>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <span>공용 백엔드: Google Sheets · 모든 변경은 즉시 전부서원에게 반영됩니다</span>
    <a class="link-btn" style="font-size:11px" href="pohang/">포항혁신지구 예산 관리로 이동 →</a>
  </div>
</div>

<script>
/* ============== 설정 ============== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyyLSq5WZcNTl8QTb5ZSTUv_t0-1dEJzHcBtrq2YAoZirziaiPG9Ek0hNtfvDEO1PZ1/exec';
const KEY_AUTHOR = 'bm_author_name';
const KEY_PASS = 'bm_passcode';
let passcode = '';
try { passcode = localStorage.getItem(KEY_PASS) || ''; } catch(e) {}

function askPasscode(msg){
  const p = prompt(msg || '부서 공용 비밀번호를 입력해 주세요.');
  if (p === null) return false;
  passcode = p.trim();
  try { localStorage.setItem(KEY_PASS, passcode); } catch(e) {}
  return true;
}
const AUTO_SYNC_SEC = 60;

/* ============== 상태 ============== */
let items = [];
let state = {};  // { item_id: [{id, date, desc, amount, author}, ...] }
let open = {}, editing = {};
let author = '';
let lastSyncAt = null;

/* ============== 유틸 ============== */
function fmt(n){ return Math.round(n).toLocaleString('ko-KR')+'원'; }
function pad2(n){ return String(n).padStart(2,'0'); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function normDate(v){
  if (v === null || v === undefined || v === '') return '';
  const s = String(v).trim();
  const m = s.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})\.?$/);
  if (m) return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function showDate(v){
  const n = normDate(v);
  return /^\d{4}-\d{2}-\d{2}$/.test(n) ? n.replace(/-/g, '.') : n;
}
function pct(used,budget){ return budget===0?0:Math.min(Math.round(used/budget*1000)/10,100); }
function sc(used,budget){ const p=pct(used,budget); return p>=100?'over':p>=80?'warn':'ok'; }
function getExecs(id){ return state[id]||[]; }
function getUsed(id){ return getExecs(id).reduce((s,e)=>s+e.amount,0); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============== 로딩 UI ============== */
function showLoading(on){
  document.getElementById('loading').classList.toggle('show', on);
  const dot = document.getElementById('sync-dot');
  if (on) dot.className = 'sync-dot loading';
}
function updateSyncStatus(ok, msg){
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (ok) {
    dot.className = 'sync-dot';
    const now = new Date();
    const t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    txt.textContent = '마지막 동기화: ' + t;
    lastSyncAt = now;
  } else {
    dot.className = 'sync-dot error';
    txt.textContent = '❌ ' + (msg || '동기화 실패');
  }
}

/* ============== 서버 통신 ============== */
async function api(action, params = {}, retried) {
  if (!passcode && !askPasscode()) return { ok: false, error: '비밀번호가 입력되지 않았습니다.' };
  const r = await apiRaw(action, params);
  if (!r.ok && r.error === 'unauthorized' && !retried) {
    if (askPasscode('비밀번호가 맞지 않습니다. 다시 입력해 주세요.')) return api(action, params, true);
    return { ok: false, error: '비밀번호가 맞지 않습니다.' };
  }
  if (!r.ok && r.error === 'unauthorized') r.error = '비밀번호가 맞지 않습니다.';
  return r;
}

async function apiRaw(action, params = {}) {
  const body = JSON.stringify(Object.assign({ action, key: passcode }, params));
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: body,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      redirect: 'follow',
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(err) {
    return { ok: false, error: String(err.message || err) };
  }
}

async function fetchData() {
  showLoading(true);
  const r = await api('list');
  if (r.ok) {
    items = (r.items || []).slice().sort((a,b) => (a.order||0) - (b.order||0));
    state = {};
    (r.executions || []).forEach(e => {
      if (!state[e.item_id]) state[e.item_id] = [];
      state[e.item_id].push({
        id: e.exec_id,
        date: normDate(e.date),
        desc: e.desc,
        amount: e.amount,
        author: e.author || '',
      });
    });
    // 각 항목의 집행 내역 날짜순 정렬
    Object.keys(state).forEach(k => {
      state[k].sort((a,b) => a.date.localeCompare(b.date));
    });
    render();
    updateSyncStatus(true);
  } else {
    updateSyncStatus(false, r.error);
    alert('데이터를 불러올 수 없습니다.\n\n' + r.error + '\n\n새로고침 버튼을 다시 눌러보세요.');
  }
  showLoading(false);
}

/* ============== 작성자 ============== */
function initAuthor() {
  author = localStorage.getItem(KEY_AUTHOR) || '';
  if (!author) {
    changeAuthor(true);
  } else {
    document.getElementById('author-display').textContent = author;
  }
}
function changeAuthor(isInitial) {
  const name = prompt(
    isInitial
      ? '본인 이름을 입력해 주세요.\n(집행 내역을 입력할 때 작성자로 기록됩니다)'
      : '작성자 이름을 변경합니다. 새 이름:',
    author || ''
  );
  if (name && name.trim()) {
    author = name.trim();
    localStorage.setItem(KEY_AUTHOR, author);
    document.getElementById('author-display').textContent = author;
  } else if (isInitial) {
    author = '익명';
    document.getElementById('author-display').textContent = author;
  }
}

/* ============== CRUD ============== */
async function addExec(id, ev){
  ev.stopPropagation();
  const dEl=document.getElementById('d_'+id), descEl=document.getElementById('desc_'+id), aEl=document.getElementById('amt_'+id);
  const date=dEl.value, desc=descEl.value.trim(), amount=parseInt(aEl.value);
  if(!date||!desc||!amount||amount<=0){ alert('날짜, 내용, 금액을 모두 입력하세요.'); return; }
  showLoading(true);
  const r = await api('add_exec', { item_id: id, date, desc, amount, author });
  if (r.ok) {
    descEl.value=''; aEl.value='';
    await fetchData();
  } else {
    showLoading(false);
    updateSyncStatus(false, r.error);
    alert('저장 실패: ' + r.error);
  }
}

async function delExec(itemId, execId, ev){
  ev.stopPropagation();
  if(!confirm('이 집행 내역을 삭제하시겠습니까?\n모든 부서원 화면에서 사라집니다.')) return;
  showLoading(true);
  const r = await api('delete_exec', { exec_id: execId });
  if (r.ok) await fetchData();
  else {
    showLoading(false);
    updateSyncStatus(false, r.error);
    alert('삭제 실패: ' + r.error);
  }
}

function startEdit(itemId, execId, ev){ ev.stopPropagation(); editing[itemId]=execId; render(); }
function cancelEdit(itemId, ev){ ev.stopPropagation(); delete editing[itemId]; render(); }

async function saveEdit(itemId, execId, ev){
  ev.stopPropagation();
  const dEl=document.getElementById('ed_'+execId), descEl=document.getElementById('edesc_'+execId), aEl=document.getElementById('eamt_'+execId);
  const date=dEl.value, desc=descEl.value.trim(), amount=parseInt(aEl.value);
  if(!date||!desc||!amount||amount<=0){ alert('날짜, 내용, 금액을 모두 입력하세요.'); return; }
  showLoading(true);
  const r = await api('update_exec', { exec_id: execId, date, desc, amount });
  if (r.ok) {
    delete editing[itemId];
    await fetchData();
  } else {
    showLoading(false);
    updateSyncStatus(false, r.error);
    alert('수정 실패: ' + r.error);
  }
}

function toggle(id){ open[id]=!open[id]; render(); }

/* ============== 항목 드래그 (순서 서버 저장) ============== */
let dragFrom = null;
function onItemDragStart(idx, ev){
  dragFrom = idx;
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', String(idx)); }catch(e){}
  ev.stopPropagation();
  const card = ev.currentTarget.closest('.item-card');
  if (card) card.classList.add('dragging');
}
function onItemDragEnd(){
  document.querySelectorAll('.item-card.dragging, .item-card.drag-over')
    .forEach(el => el.classList.remove('dragging','drag-over'));
  dragFrom = null;
}
function onItemDragOver(ev){ if (dragFrom === null) return; ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; }
function onItemDragEnter(idx, ev){ if (dragFrom === null || dragFrom === idx) return; ev.currentTarget.classList.add('drag-over'); }
function onItemDragLeave(ev){
  const t = ev.currentTarget, r = ev.relatedTarget;
  if (!r || !t.contains(r)) t.classList.remove('drag-over');
}
async function onItemDrop(toIdx, ev){
  ev.preventDefault(); ev.stopPropagation();
  ev.currentTarget.classList.remove('drag-over');
  if (dragFrom === null || dragFrom === toIdx) { dragFrom = null; return; }
  const [moved] = items.splice(dragFrom, 1);
  items.splice(toIdx, 0, moved);
  items.forEach((it, i) => { it.order = i + 1; });
  dragFrom = null;
  render();
  showLoading(true);
  const r = await api('reorder', { order: items.map(i => i.id) });
  showLoading(false);
  if (r.ok) {
    updateSyncStatus(true);
  } else {
    updateSyncStatus(false, r.error);
    alert('순서 저장 실패: ' + r.error + '\n\n서버의 순서로 되돌립니다.');
    await fetchData();
  }
}

/* ============== 백업 ============== */
function exportBackup(){
  if (!items.length) { alert('아직 데이터가 로드되지 않았습니다.'); return; }
  const totalUsed = items.reduce((s,i)=>s+getUsed(i.id),0);
  const totalBudget = items.reduce((s,i)=>s+i.budget,0);
  const payload = {
    program: '전문교육부',
    fiscal_year: 2026,
    exported_at: new Date().toISOString(),
    exported_by: author,
    version: 'cloud-1',
    total_budget: totalBudget,
    total_used: totalUsed,
    total_remaining: totalBudget - totalUsed,
    items: items.map(i => ({
      id: i.id, name: i.name, budget: i.budget,
      used: getUsed(i.id), remaining: i.budget - getUsed(i.id),
    })),
    executions: state,
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '전문교육부_예산_백업_' + today() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============== 렌더 ============== */
function renderSummary(){
  const totalBudget = items.reduce((s,i)=>s+i.budget,0);
  const totalUsed = items.reduce((s,i)=>s+getUsed(i.id),0);
  const remaining = totalBudget - totalUsed;
  const p = pct(totalUsed, totalBudget);
  document.getElementById('summary').innerHTML=`
    <div class="metric"><div class="metric-label">총 예산</div><div class="metric-value">${fmt(totalBudget)}</div></div>
    <div class="metric"><div class="metric-label">집행액 (${p}%)</div><div class="metric-value ${p>=100?'danger':''}">${fmt(totalUsed)}</div></div>
    <div class="metric"><div class="metric-label">잔액</div><div class="metric-value ${remaining<0?'danger':'success'}">${fmt(remaining)}</div></div>`;
}

function renderItems(){
  if (!items.length) {
    document.getElementById('items-list').innerHTML = `<div class="empty-note" style="padding:30px">예산 항목이 없습니다. Google 시트의 items 탭을 확인하세요.</div>`;
    return;
  }
  document.getElementById('items-list').innerHTML = items.map((item, itemIdx) => {
    const execs = getExecs(item.id);
    const used = getUsed(item.id);
    const remaining = item.budget - used;
    const p = pct(used, item.budget);
    const cls = sc(used, item.budget);
    const isOpen = open[item.id];
    const editingId = editing[item.id];
    const fillW = Math.min(p, 100);

    const execRows = execs.map(e => {
      if (editingId === e.id) {
        return `<div class="edit-full-row">
          <input type="date"   id="ed_${e.id}"    value="${esc(e.date)}"/>
          <input type="text"   id="edesc_${e.id}" value="${esc(e.desc)}"/>
          <input type="number" id="eamt_${e.id}"  value="${e.amount}" min="0"/>
          <div class="ph">${esc(e.author || '')}</div>
          <div class="exec-actions">
            <button class="btn-act btn-save"   onclick="saveEdit('${item.id}',${e.id},event)">저장</button>
            <button class="btn-act btn-cancel" onclick="cancelEdit('${item.id}',event)">취소</button>
          </div>
        </div>`;
      }
      return `<div class="exec-row">
        <div class="exec-date">${esc(showDate(e.date))}</div>
        <div class="exec-desc">${esc(e.desc)}</div>
        <div class="exec-amt">${fmt(e.amount)}</div>
        <div class="exec-author">${esc(e.author || '')}</div>
        <div class="exec-actions">
          <button class="btn-act btn-edit" onclick="startEdit('${item.id}',${e.id},event)">수정</button>
          <button class="btn-act btn-del"  onclick="delExec('${item.id}',${e.id},event)">삭제</button>
        </div>
      </div>`;
    }).join('');

    return `<div class="item-card"
        ondragover="onItemDragOver(event)"
        ondragenter="onItemDragEnter(${itemIdx},event)"
        ondragleave="onItemDragLeave(event)"
        ondrop="onItemDrop(${itemIdx},event)">
      <div class="item-row row-grid" onclick="toggle('${item.id}')">
        <div class="item-drag-handle"
             draggable="true"
             ondragstart="onItemDragStart(${itemIdx},event)"
             ondragend="onItemDragEnd(event)"
             onclick="event.stopPropagation()"
             title="드래그하여 항목 순서 변경">⋮⋮</div>
        <div class="cell name" title="${esc(item.name)}">${esc(item.name)}</div>
        <div class="cell r">${fmt(item.budget)}</div>
        <div class="cell r">${fmt(used)}</div>
        <div class="cell r ${cls}">${fmt(remaining)}</div>
        <div class="bar-cell">
          <div class="bar-stack"><div class="bar-fill ${cls}" style="width:${fillW}%"></div></div>
          <div class="bar-pct">${p}%</div>
        </div>
        <div class="arrow ${isOpen?'open':''}">▼</div>
      </div>
      ${isOpen ? `<div class="item-body" onclick="event.stopPropagation()">
        ${execs.length === 0 ? `<div class="empty-note">집행 내역이 없습니다.</div>` : `
        <div>
          <div class="exec-list-header">
            <div>날짜</div><div>내용</div><div class="r">금액</div><div class="c">작성자</div><div class="c">관리</div>
          </div>
          ${execRows}
        </div>`}
        <div class="add-form-card">
          <div class="add-form-title">+ 새 집행 내역 추가</div>
          <div class="add-form-grid">
            <div class="field-group"><label class="field-label">날짜</label><input type="date" id="d_${item.id}" value="${today()}" onclick="event.stopPropagation()"/></div>
            <div class="field-group"><label class="field-label">집행 내용</label><input type="text" id="desc_${item.id}" placeholder="예: 1분기 실습재료 구매" onclick="event.stopPropagation()"/></div>
            <div class="field-group"><label class="field-label">금액 (원)</label><input type="number" id="amt_${item.id}" placeholder="0" min="0" onclick="event.stopPropagation()"/></div>
          </div>
          <div class="add-form-btn-row"><button class="add-btn" onclick="addExec('${item.id}',event)">+ 추가</button></div>
        </div>
      </div>` : ''}
    </div>`;
  }).join('');
}

function render(){ renderSummary(); renderItems(); }

/* ============== 자동 동기화 ============== */
setInterval(() => {
  // 입력 중이거나 편집 중일 때는 건너뜀
  if (Object.keys(editing).length > 0) return;
  if (dragFrom !== null) return;
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
  fetchData();
}, AUTO_SYNC_SEC * 1000);

/* ============== 초기화 ============== */
initAuthor();
fetchData();
</script>
</body>
